<!DOCTYPE html>
<html lang="ru">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Лента уроков</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap">

<style>
  :root{
    --paper:#F4F6FB; --sheet:#FFFFFF; --sheet-2:#EDF0F7; --line:#DDE3EF; --rule:#C9D1E3;
    --ink:#171D2A; --ink-2:#414C63; --muted:#6D7997;
    --pen:#2A4C9E; --pen-soft:#E3EAF9;
    --red:#BE3A2E; --red-soft:#FBEAE7; --red-line:#E8B4AC;
    --green:#2F6B3E; --green-soft:#E4F0E6;
    --a-rus:#2A4C9E; --a-mat:#10706B; --a-eng:#7A3E9C; --a-lit:#1F5FA8;
    --a-ist:#8A5B12; --a-bio:#3B6B2E; --a-geo:#8A5B12; --a-obs:#8A5B12; --a-inf:#10706B;
    --shadow:0 1px 2px rgba(23,29,42,.05),0 8px 22px -14px rgba(23,29,42,.2);
    --r:10px;
  }
  @media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
    --paper:#0F1420; --sheet:#171E2C; --sheet-2:#1E2637; --line:#283246; --rule:#2E384D;
    --ink:#E7EBF4; --ink-2:#B4BDD1; --muted:#838EA6;
    --pen:#86A8EE; --pen-soft:#1D2A45;
    --red:#E88175; --red-soft:#3A1F1C; --red-line:#6B3229;
    --green:#7FC08D; --green-soft:#18301D;
    --a-rus:#8CACEF; --a-mat:#56BDB3; --a-eng:#C79BCE; --a-lit:#7FB3E8;
    --a-ist:#D9A85A; --a-bio:#8CC177; --a-geo:#D9A85A; --a-obs:#D9A85A; --a-inf:#56BDB3;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 26px -16px rgba(0,0,0,.7);
  }}
  :root[data-theme="dark"]{
    --paper:#0F1420; --sheet:#171E2C; --sheet-2:#1E2637; --line:#283246; --rule:#2E384D;
    --ink:#E7EBF4; --ink-2:#B4BDD1; --muted:#838EA6;
    --pen:#86A8EE; --pen-soft:#1D2A45;
    --red:#E88175; --red-soft:#3A1F1C; --red-line:#6B3229;
    --green:#7FC08D; --green-soft:#18301D;
    --a-rus:#8CACEF; --a-mat:#56BDB3; --a-eng:#C79BCE; --a-lit:#7FB3E8;
    --a-ist:#D9A85A; --a-bio:#8CC177; --a-geo:#D9A85A; --a-obs:#D9A85A; --a-inf:#56BDB3;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 26px -16px rgba(0,0,0,.7);
  }

  *{box-sizing:border-box}
  /* .group задаёт display:flex и без !important перебил бы служебное правило
     браузера — блок долгов не прятался бы, когда долгов нет. */
  [hidden]{display:none!important}
  body{margin:0;background:var(--paper);color:var(--ink);
    font-family:"Golos Text","Segoe UI",system-ui,sans-serif;font-size:16px;line-height:1.5;
    -webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
  .app{max-width:860px;margin:0 auto;padding:14px 12px 60px;display:flex;flex-direction:column;gap:14px}

  .bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;
    background:var(--sheet);border:1px solid var(--rule);border-radius:var(--r);
    padding:9px 11px;box-shadow:var(--shadow)}
  .who{display:flex;gap:5px;background:var(--sheet-2);border-radius:9px;padding:3px}
  .who button{appearance:none;border:0;background:transparent;color:var(--ink-2);
    font:600 15px/1 "Golos Text",sans-serif;padding:12px 17px;border-radius:7px;cursor:pointer;min-height:46px}
  .who button[aria-pressed="true"]{background:var(--pen);color:#fff}

  .nav{display:flex;align-items:center;gap:6px;margin-left:auto}
  .nav button{appearance:none;border:1px solid var(--rule);background:var(--sheet-2);color:var(--ink);
    font:600 17px/1 "Golos Text",sans-serif;width:46px;height:46px;border-radius:9px;cursor:pointer}
  .nav button:disabled{opacity:.35;cursor:default}
  .nav button.wide{width:auto;padding:0 14px;font:600 13.5px/1 "Golos Text",sans-serif}
  .nowchip{display:inline-block;margin-left:9px;font-size:11px;font-weight:700;letter-spacing:.06em;
    text-transform:uppercase;color:#fff;background:var(--green);border-radius:4px;padding:3px 8px;
    vertical-align:3px}
  select{appearance:none;background:var(--sheet-2);border:1px solid var(--rule);color:var(--ink);
    font:500 14px/1 "Golos Text",sans-serif;padding:12px 11px;border-radius:9px;min-height:46px;cursor:pointer;
    max-width:190px}

  .today-line{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;padding:0 4px}
  .today-line h1{margin:0;font-size:19px;font-weight:700;letter-spacing:-.01em}
  .today-line span{font-size:13.5px;color:var(--muted)}
  .today-line .wk{font-family:"JetBrains Mono",monospace;font-size:12px;color:var(--muted)}

  .prog{height:6px;border-radius:3px;background:var(--sheet-2);overflow:hidden;border:1px solid var(--line)}
  .prog i{display:block;height:100%;background:var(--green);width:0}

  .summary{background:var(--sheet);border:1px solid var(--rule);border-radius:var(--r);
    box-shadow:var(--shadow);padding:12px 14px;display:flex;flex-direction:column;gap:10px}
  .summary h2{margin:0;font-size:11.5px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
  .lags{display:flex;flex-wrap:wrap;gap:6px}
  .lag{display:flex;align-items:baseline;gap:6px;border:1px solid var(--line);border-radius:7px;
    padding:6px 10px;font-size:13px;background:var(--sheet-2)}
  .lag b{font-family:"JetBrains Mono",monospace;font-variant-numeric:tabular-nums;font-size:13px}
  .lag.behind{background:var(--red-soft);border-color:var(--red-line)}
  .lag.behind b{color:var(--red)}
  .lag.ahead b{color:var(--green)}
  .lag.ok b{color:var(--muted)}
  .sync{font-size:11.5px;color:var(--muted);display:flex;align-items:center;gap:6px}
  .dot{width:7px;height:7px;border-radius:50%;background:var(--muted);display:block;flex:none}
  .dot.on{background:var(--green)} .dot.off{background:var(--red)}

  .group{display:flex;flex-direction:column;gap:8px}
  .ghead{display:flex;align-items:baseline;gap:9px;padding:0 4px}
  .ghead h3{margin:0;font-size:13px;font-weight:700;letter-spacing:.07em;text-transform:uppercase}
  .ghead.debt h3{color:var(--red)}
  .ghead.today h3{color:var(--ink-2)}
  .ghead span{font-size:12.5px;color:var(--muted)}
  .more{appearance:none;border:1px solid var(--rule);background:var(--sheet-2);color:var(--ink-2);
    font:600 13px/1 "Golos Text",sans-serif;padding:11px 14px;border-radius:9px;cursor:pointer;
    min-height:44px;align-self:flex-start}

  .card{display:grid;grid-template-columns:44px 1fr auto;gap:11px;align-items:center;
    background:var(--sheet);border:1px solid var(--rule);border-left:4px solid var(--acc,var(--rule));
    border-radius:var(--r);padding:11px 13px;box-shadow:var(--shadow);
    cursor:pointer;user-select:none;min-height:64px;transition:background .12s}
  .card:active{background:var(--sheet-2)}
  .card.debt{border-color:var(--red-line);background:var(--red-soft)}
  .card.done{background:var(--sheet-2);border-left-color:var(--green)}
  .card.done .tp{text-decoration:line-through;color:var(--muted)}
  .card.done .sj{color:var(--muted)}

  .tick{width:34px;height:34px;border-radius:50%;border:2px solid var(--rule);
    display:flex;align-items:center;justify-content:center;background:var(--sheet);
    font-size:18px;color:transparent;flex:none;margin-left:4px}
  .card.done .tick{background:var(--green);border-color:var(--green);color:#fff}
  .card.debt .tick{border-color:var(--red-line)}

  .mid{min-width:0;display:flex;flex-direction:column;gap:2px}
  .sj{font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--acc,var(--muted))}
  .tp{font-size:15px;line-height:1.35;font-weight:500;overflow-wrap:break-word}
  .kd{font-size:11.5px;color:var(--muted)}
  /* ссылки, добавленные родителем в плане */
  .links.own a{color:var(--red);background:var(--red-soft)}
  /* урок аттестации ЕдПалм: красная рамка и красная подпись вида урока */
  .card.att{border:2px solid #B8402F;background:#FDF1EE}
  .card.att .kd{color:#B8402F;font-weight:700;text-transform:uppercase;letter-spacing:.04em}
  .links{display:flex;flex-wrap:wrap;gap:6px;margin-top:5px}
  .links a{font-size:12px;font-weight:600;color:var(--pen);background:var(--pen-soft);
    border-radius:6px;padding:6px 10px;text-decoration:none;min-height:32px;
    display:inline-flex;align-items:center}
  .links a:active{opacity:.7}
  /* сторонний источник, который родитель ещё не утвердил */
  .links a.chk{color:#8A5A12;background:#FDF0D5;border:1px dashed #C79A3E}
  .card.done .links a{opacity:.5}
  /* файлы урока: название открывает, «Скачать» — сохраняет */
  .links.files a{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .links.files a.dl{background:transparent;box-shadow:inset 0 0 0 1px var(--pen-soft)}

  .rgt{text-align:right;display:flex;flex-direction:column;gap:3px;align-items:flex-end}
  .tm{font-family:"JetBrains Mono",monospace;font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums}
  .chip{font-size:10px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;
    border-radius:3px;padding:2px 6px;white-space:nowrap}
  .chip.d{color:var(--red);background:var(--red-soft);border:1px solid var(--red-line)}

  .empty{padding:20px 16px;text-align:center;color:var(--muted);font-size:14px;
    background:var(--sheet);border:1px dashed var(--rule);border-radius:var(--r)}

  .rus{--acc:var(--a-rus)}.mat{--acc:var(--a-mat)}.eng{--acc:var(--a-eng)}.lit{--acc:var(--a-lit)}
  .ist{--acc:var(--a-ist)}.bio{--acc:var(--a-bio)}.geo{--acc:var(--a-geo)}.obs{--acc:var(--a-obs)}.inf{--acc:var(--a-inf)}

  .foot{font-size:12.5px;color:var(--muted);line-height:1.5;padding:0 4px}
  .foot b{color:var(--ink-2)}

  @media (max-width:540px){
    .card{grid-template-columns:38px 1fr;gap:10px}
    .rgt{grid-column:2;flex-direction:row;align-items:center;gap:8px}
    select{max-width:140px}
  }
</style>

<div class="app">
  <div class="bar">
    <div class="who" id="who" role="group" aria-label="Ученик"></div>
    <div class="nav">
      <button type="button" id="prev" aria-label="Предыдущий день">‹</button>
      <select id="day" aria-label="Учебный день"></select>
      <button type="button" id="next" aria-label="Следующий день">›</button>
      <button type="button" id="todayBtn" class="wide">Сегодня</button>
    </div>
  </div>

  <div class="today-line">
    <h1 id="dayTitle">—</h1>
    <span id="dayMeta"></span>
    <span class="wk" id="weekMeta"></span>
  </div>
  <div class="prog"><i id="progBar"></i></div>

  <div class="summary">
    <h2>Отставание по предметам</h2>
    <div class="lags" id="lags"></div>
    <div class="sync"><span class="dot" id="dot"></span><span id="syncText">загружаю…</span></div>
  </div>

  <div class="group" id="debtGroup" hidden>
    <div class="ghead debt"><h3>Долги</h3><span id="debtCount"></span></div>
    <div id="debtList" style="display:flex;flex-direction:column;gap:8px"></div>
    <button type="button" class="more" id="debtMore" hidden></button>
  </div>

  <div class="group">
    <div class="ghead today"><h3>Уроки дня</h3><span id="todayMeta"></span></div>
    <div id="todayList" style="display:flex;flex-direction:column;gap:8px"></div>
  </div>

  <p class="foot">Тап по карточке отмечает урок пройденным, повторный тап снимает отметку. Долг можно закрыть отдельно, вне сетки: он просто исчезнет из списка, а уроки дня останутся на своих местах. <b id="footNote"></b></p>
</div>

    return out;
  }

  function clone(e) { return JSON.parse(JSON.stringify(norm(e))); }

  /* dates — все учебные дни по порядку; base — { дата: [id, …] } из генератора.
     Урок, упомянутый в любом ручном списке, из исходных дней убирается — так после
     пересборки плана он не задвоится, даже если генератор поставил его на другой день.
     Неизвестные и удалённые уроки отбрасываются; повтор оставляет первое вхождение. */
  function effective(dates, base, edits) {
    var e = norm(edits), manual = {}, known = {}, seen = {}, out = {};
    dates.forEach(function (d) {
      (base[d] || []).forEach(function (id) { known[id] = true; });
      if (Array.isArray(e.days[d])) e.days[d].forEach(function (id) { manual[id] = true; });
    });
    Object.keys(e.added).forEach(function (id) { known[id] = true; });
    dates.forEach(function (d) {
      var src = Array.isArray(e.days[d])
        ? e.days[d]
        : (base[d] || []).filter(function (id) { return !manual[id]; });
      out[d] = src.filter(function (id) {
        if (typeof id !== "string" || !known[id] || has(e.deleted, id) || seen[id]) return false;
        seen[id] = true;
        return true;
      });
    });
    return out;
  }

  /* Время i-го урока дня. Сверх сетки — каждый следующий на час позже последнего. */
  function timeAt(times, i) {
    if (i < times.length) return times[i];
    var p = String(times[times.length - 1]).split(":");
    var m = (+p[0]) * 60 + (+p[1]) + 60 * (i - times.length + 1);
    return Math.floor(m / 60) + ":" + ("0" + (m % 60)).slice(-2);
  }

  function newId() { return "x:" + Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }

  /* ── Файлы урока ──
     files — задания, лежат в открытой корзине и показываются всем;
     keys  — ответы для родителя, лежат в закрытой корзине и в плане не отображаются. */
  function listOf(edits, slot, id) {
    var f = norm(edits)[slot][id];
    if (!Array.isArray(f)) return [];
    return f.filter(function (x) { return x && typeof x.p === "string" && x.p && typeof x.n === "string"; });
  }
  function filesOf(edits, id) { return listOf(edits, "files", id); }
  function keysOf(edits, id) { return listOf(edits, "keys", id); }

  /* Ссылки родителя. Пускаем только http и https: javascript: и data: в плане
     открывать нельзя, страницу смотрят дети. */
  function safeUrl(u) { return typeof u === "string" && /^https?:\/\/\S+$/i.test(u.trim()); }
  function linksOf(edits, id) {
    var l = norm(edits).links[id];
    if (!Array.isArray(l)) return [];
    return l.filter(function (x) { return x && safeUrl(x.u) && typeof x.n === "string" && x.n; })
            .map(function (x) { return { u: x.u.trim(), n: x.n }; });
  }

  /* name — если задано, ссылка отдаёт файл на скачивание под этим именем */
  function fileUrl(cfg, path, name) {
    var api = String(cfg.url).replace(/\/+$/, "");
    var u = api + "/storage/v1/object/public/" + BUCKET + "/" + String(path).split("/").map(encodeURIComponent).join("/");
    return name ? u + "?download=" + encodeURIComponent(name) : u;
  }

  function sizeText(b) {
    b = +b || 0;
    if (b < 1024) return b + " Б";
    if (b < 1024 * 1024) return Math.round(b / 1024) + " КБ";
    return (Math.round(b / 1024 / 1024 * 10) / 10).toString().replace(".", ",") + " МБ";
  }

  /* { edits, at } — правки есть; { missing: true } — таблица ещё не заведена. */
  function fetchEdits(cfg) {
    var api = String(cfg.url).replace(/\/+$/, "");
    return fetch(api + "/rest/v1/plan_edits?id=eq.main&select=edits,updated_at", {
      headers: { apikey: cfg.key, Authorization: "Bearer " + cfg.key },
      cache: "no-store"
    }).then(function (r) {
      if (r.status === 404) return { missing: true };
      if (!r.ok) throw new Error("plan_edits " + r.status);
      return r.json().then(function (rows) {
        if (!rows || !rows.length) return { missing: true };
        return { edits: norm(rows[0].edits), at: rows[0].updated_at };
      });
    });
  }

  root.PlanEdits = { has: has, norm: norm, clone: clone, effective: effective,
                     timeAt: timeAt, newId: newId, fetchEdits: fetchEdits,
                     BUCKET: BUCKET, KEYBUCKET: KEYBUCKET,
                     filesOf: filesOf, keysOf: keysOf, linksOf: linksOf, safeUrl: safeUrl,
                     fileUrl: fileUrl, sizeText: sizeText };
})(window);

</script>
<script>
(function () {
  "use strict";

  var MONTHS = ["января","февраля","марта","апреля","мая","июня","июля","августа","сентября","октября","ноября","декабря"];
  var DOWS = ["воскресенье","понедельник","вторник","среда","четверг","пятница","суббота"];
  var DOWS_S = ["вс","пн","вт","ср","чт","пт","сб"];

  function parse(s) { var p = s.split("-"); return new Date(+p[0], +p[1] - 1, +p[2]); }

  /* Сегодняшняя дата по часам устройства и ближайший к ней учебный день */
  function realToday() {
    var n = new Date();
    return n.getFullYear() + "-" + ("0" + (n.getMonth() + 1)).slice(-2) + "-" + ("0" + n.getDate()).slice(-2);
  }
  function todayIdx() {
    var t = realToday(), i = DATA.days.indexOf(t);
    if (i >= 0) return i;
    for (var k = 0; k < DATA.days.length; k++) { if (DATA.days[k] > t) return k; }
    return DATA.days.length - 1;
  }
  function human(s) { var d = parse(s); return DOWS[d.getDay()] + ", " + d.getDate() + " " + MONTHS[d.getMonth()]; }
  function shortHuman(s) { var d = parse(s); return DOWS_S[d.getDay()] + " " + d.getDate() + " " + MONTHS[d.getMonth()].slice(0, 3); }
  function plural(n, one, few, many) {
    var a = Math.abs(n) % 100, b = a % 10;
    if (a > 10 && a < 20) return many;
    if (b > 1 && b < 5) return few;
    if (b === 1) return one;
    return many;
  }

  /* ── Исходная раскладка: k-й слот предмета несёт k-й урок его ленты.
     Урок называется «предмет:номер» — это же ключ его отметки в базе. ── */
  var BASE = {}, WEEKOF = {};
  (function () {
    var cnt = {};
    DATA.order.forEach(function (s) { cnt[s] = 0; });
    DATA.days.forEach(function (date, di) {
      WEEKOF[date] = DATA.weekOf[di];
      BASE[date] = (DATA.daySubj[di] || []).map(function (s) { return s + ":" + (cnt[s]++); });
    });
  })();

  /* ── Правки родителя из «Шестого класса по дням» (plan-edits.js) ──
     Перенесённый урок показывается в новый день, удалённый пропадает из дня и из долгов,
     добавленный отмечается так же, как обычный. Отметка хранится по ключу урока
     и переезжает вместе с ним. */
  var PE = window.PlanEdits || null;
  var EDITS = { days: {}, titles: {}, added: {}, deleted: {} }, EFF = BASE, editsJson = "";
  function rebuild() { EFF = PE ? PE.effective(DATA.days, BASE, EDITS) : BASE; }
  rebuild();

  function lessonOf(id) {
    if (id.indexOf("x:") === 0) {
      var a = EDITS.added[id];
      return (a && DATA.subj[a.s]) ? { s: a.s, t: a.t, k: "добавлен родителем", u: [] } : null;
    }
    var p = id.split(":"), s = p[0], q = DATA.queue[s] && DATA.queue[s][+p[1]];
    if (!q) return null;
    var t = Object.prototype.hasOwnProperty.call(EDITS.titles, id) ? EDITS.titles[id] : q.t;
    return { s: s, t: t, k: q.k, u: q.u || [] };
  }
  function timeOf(i) { return PE ? PE.timeAt(DATA.times, i) : DATA.times[i]; }

  /* Идентификаторы s1/s2 менять нельзя — по ним лежат отметки в базе. */
  var STUDENTS = [{ id: "s1", name: "Лёша" }, { id: "s2", name: "Юра" }];
  var sid = "s1", today = DATA.days[0], marks = {}, db = null, unsub = null, showAllDebts = false;
  var seeded = {};

  function lsGet(k, d) { try { var v = localStorage.getItem(k); return v == null ? d : v; } catch (e) { return d; } }
  function lsSet(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }

  function isDone(id) { return Object.prototype.hasOwnProperty.call(marks, id); }

  /* Отметка отдельного урока — независимо от остальных. */
  function toggle(id) {
    if (isDone(id)) delete marks[id];
    else marks[id] = today;
    save();
    render();
  }

  /* ── Хранилище ──
     Три режима, выбираются сами:
       1. Supabase — если страница собрана с настройками (веб-версия)
       2. база песочницы claude.ai — если страница открыта как артефакт
       3. память устройства — если ни того, ни другого нет            */
  var dot = document.getElementById("dot"), syncText = document.getElementById("syncText");
  function setSync(state, text) { dot.className = "dot" + (state ? " " + state : ""); syncText.textContent = text; }

  var CFG = window.SCHOOL_CFG || {};
  var sb = (CFG.url && CFG.key) ? { url: String(CFG.url).replace(/\/+$/, ""), key: CFG.key } : null;
  var poll = null, lastSaveAt = 0;

  function sbHeaders(extra) {
    var h = { "apikey": sb.key, "Authorization": "Bearer " + sb.key };
    if (extra) { for (var k in extra) if (extra.hasOwnProperty(k)) h[k] = extra[k]; }
    return h;
  }
  function sbRow() { return sb.url + "/rest/v1/progress?student=eq." + encodeURIComponent(sid); }

  function save() {
    if (sb) {
      lastSaveAt = Date.now();
      fetch(sbRow(), {
        method: "PATCH",
        headers: sbHeaders({ "Content-Type": "application/json", "Prefer": "return=minimal" }),
        body: JSON.stringify({ marks: marks, updated_at: new Date().toISOString() })
      }).then(function (r) {
        if (!r.ok) throw new Error(r.status);
        setSync("on", "синхронизируется между устройствами");
      }).catch(function () { setSync("off", "не сохранилось — проверьте связь"); });
    } else if (db) {
      db.doc("progress/" + sid).set({ marks: marks, at: Date.now() })
        .catch(function () { setSync("off", "не сохранилось — проверьте связь"); });
    } else {
      lsSet("marks:" + sid, JSON.stringify(marks));
    }
  }

  /* Забираем состояние с сервера. Сразу после своей записи пропускаем один
     цикл, чтобы не затереть только что сделанную отметку старым ответом. */
  function pull(force) {
    if (!force && Date.now() - lastSaveAt < 4000) return;
    fetch(sbRow() + "&select=marks", { headers: sbHeaders(null) })
      .then(function (r) { if (!r.ok) throw new Error(r.status); return r.json(); })
      .then(function (rows) {
        if (!rows || !rows.length) { setSync("off", "строка ученика не найдена в базе"); return; }
        var remote = rows[0].marks || {};
        if (JSON.stringify(remote) !== JSON.stringify(marks)) { marks = remote; render(); }
        setSync("on", "синхронизируется между устройствами");
      })
      .catch(function () { setSync("off", "нет связи с базой"); });
  }

  /* Правки плана подтягиваются тем же циклом, что и отметки. Если таблицы
     правок в базе нет — лента просто живёт по исходному расписанию. */
  function pullEdits() {
    if (!sb || !PE) return;
    PE.fetchEdits(CFG).then(function (res) {
      if (!res || res.missing) return;
      var j = JSON.stringify(res.edits);
      if (j === editsJson) return;
      editsJson = j; EDITS = res.edits; rebuild(); render();
    }).catch(function () {});
  }

  function watch() {
    if (unsub) { try { unsub(); } catch (e) {} unsub = null; }
    if (poll) { clearInterval(poll); poll = null; }
    if (sb) {
      setSync("", "загружаю…");
      marks = {};
      pull(true);
      pullEdits();
      poll = setInterval(function () { if (!document.hidden) { pull(false); pullEdits(); } }, 12000);
      return;
    }
    if (db) {
      setSync("", "загружаю…");
      unsub = db.doc("progress/" + sid).onSnapshot(function (snap) {
        var exists = !!(snap && snap.exists);
        var d = exists ? snap.data() : null;
        /* Снапшот заморожен — работаем с копией, иначе запись падает. */
        marks = Object.assign({}, (d && d.marks) || {});

        /* Первый выход в базу: поднимаем отметки, сделанные локально до неё. */
        if (!exists && !seeded[sid]) {
          seeded[sid] = true;
          var local = {};
          try { local = JSON.parse(lsGet("marks:" + sid, "{}")) || {}; } catch (e) { local = {}; }
          if (Object.keys(local).length) {
            marks = local;
            setSync("on", "переношу отметки с этого устройства…");
            save();
            render();
            return;
          }
        }
        setSync("on", "синхронизируется между устройствами");
        render();
      }, function () { setSync("off", "нет связи с базой"); });
    } else {
      try { marks = JSON.parse(lsGet("marks:" + sid, "{}")) || {}; } catch (e) { marks = {}; }
      render();
    }
  }

  /* ── Карточка ── */
  function card(id, opts) {
    var lesson = lessonOf(id);
    if (!lesson) return null;
    var s = lesson.s, done = isDone(id);
    var el = document.createElement("div");
    /* уроки аттестации ЕдПалм выделяются рамкой и меткой */
    el.className = "card " + s + (opts.debt && !done ? " debt" : "") + (done ? " done" : "")
      + (lesson.k === "аттестация" ? " att" : "");
    el.setAttribute("role", "button");
    el.setAttribute("tabindex", "0");
    el.setAttribute("aria-pressed", done ? "true" : "false");

    var tick = document.createElement("div");
    tick.className = "tick"; tick.textContent = "✓";

    var mid = document.createElement("div");
    mid.className = "mid";
    var sj = document.createElement("div"); sj.className = "sj"; sj.textContent = DATA.subj[s].n;
    var tp = document.createElement("div"); tp.className = "tp"; tp.textContent = lesson.t;
    mid.appendChild(sj); mid.appendChild(tp);
    if (lesson.k) { var kd = document.createElement("div"); kd.className = "kd"; kd.textContent = lesson.k; mid.appendChild(kd); }

    /* Ссылки на видеоурок InternetUrok и на платформу аттестации ЕдПалм —
       тап по ним не отмечает урок */
    if (lesson.u && lesson.u.length) {
      var lr = document.createElement("div");
      lr.className = "links";
      var nVid = 0, nv = lesson.nv || [];
      var vidTotal = lesson.u.filter(function (h) { return h.indexOf("interneturok") >= 0; }).length;
      lesson.u.forEach(function (href, n) {
        var a = document.createElement("a");
        a.href = href; a.target = "_blank"; a.rel = "noopener";
        if (nv.indexOf(n) >= 0) {
          /* Сторонний источник: родитель смотрит его первым */
          a.className = "chk";
          a.title = "Сторонний источник: сначала смотрит родитель";
          a.textContent = href.indexOf("lesson.edu.ru") >= 0
            ? "Материал подбирает родитель"
            : "На проверку у родителя";
        } else if (href.indexOf("interneturok") >= 0) {
          nVid++;
          a.textContent = vidTotal > 1 ? "Видео " + nVid : "Видеоурок";
        } else if (href.indexOf("videoaccordion") >= 0) {
          a.textContent = "Видеоурок ЕдПалм";
        } else if (href.indexOf("edpalm") >= 0 && href.indexOf("tilda") >= 0) {
          a.textContent = "Панель ЕдПалм";
        } else if (href.indexOf("edpalm") >= 0) {
          a.textContent = "Тренажёр ЕдПалм";
        } else {
          a.textContent = "Открыть материал";
        }
        a.addEventListener("click", function (e) { e.stopPropagation(); });
        lr.appendChild(a);
      });
      mid.appendChild(lr);
    }

    /* Ссылки, добавленные родителем в плане */
    var own = (PE && sb) ? PE.linksOf(EDITS, id) : [];
    if (own.length) {
      var lo = document.createElement("div");
      lo.className = "links own";
      own.forEach(function (l) {
        var a = document.createElement("a");
        a.href = l.u; a.target = "_blank"; a.rel = "noopener"; a.textContent = l.n;
        a.addEventListener("click", function (e) { e.stopPropagation(); });
        lo.appendChild(a);
      });
      mid.appendChild(lo);
    }

    /* Файлы, прикреплённые родителем: открыть в браузере или скачать.
       Тап по ссылке урок не отмечает. */
    var files = (PE && sb) ? PE.filesOf(EDITS, id) : [];
    if (files.length) {
      var fr = document.createElement("div");
      fr.className = "links files";
      files.forEach(function (f) {
        var open = document.createElement("a");
        open.href = PE.fileUrl(CFG, f.p); open.target = "_blank"; open.rel = "noopener";
        open.textContent = f.n; open.title = "Открыть · " + PE.sizeText(f.s);
        var dl = document.createElement("a");
        dl.href = PE.fileUrl(CFG, f.p, f.n); dl.className = "dl"; dl.textContent = "Скачать";
        dl.setAttribute("aria-label", "Скачать " + f.n);
        [open, dl].forEach(function (x) {
          x.addEventListener("click", function (e) { e.stopPropagation(); });
          fr.appendChild(x);
        });
      });
      mid.appendChild(fr);
    }

    var rgt = document.createElement("div");
    rgt.className = "rgt";
    if (opts.time) { var tm = document.createElement("div"); tm.className = "tm"; tm.textContent = opts.time; rgt.appendChild(tm); }
    if (opts.debtDate) { var ch = document.createElement("span"); ch.className = "chip d"; ch.textContent = shortHuman(opts.debtDate); rgt.appendChild(ch); }

    el.appendChild(tick); el.appendChild(mid); el.appendChild(rgt);
    el.addEventListener("click", function () { toggle(id); });
    el.addEventListener("keydown", function (e) {
      if (e.key === "Enter" || e.key === " ") { e.preventDefault(); el.click(); }
    });
    return el;
  }

  /* ── Отрисовка ── */
  function render() {
    var who = document.getElementById("who");
    who.innerHTML = "";
    STUDENTS.forEach(function (st) {
      var b = document.createElement("button");
      b.type = "button"; b.textContent = st.name;
      b.setAttribute("aria-pressed", st.id === sid ? "true" : "false");
      b.addEventListener("click", function () {
        if (sid === st.id) return;
        sid = st.id; lsSet("sid", sid); showAllDebts = false; watch();
      });
      who.appendChild(b);
    });

    var dt = document.getElementById("dayTitle");
    dt.textContent = human(today);
    if (today === realToday()) {
      var chip = document.createElement("span");
      chip.className = "nowchip"; chip.textContent = "сегодня";
      dt.appendChild(chip);
    }
    var wk = WEEKOF[today];
    document.getElementById("weekMeta").textContent = "неделя " + (wk + 1) + " · " + DATA.weeks[wk];

    /* Один проход по году: долги (день прошёл, отметки нет), опережение и прогресс.
       Идём по дням с учётом правок родителя, поэтому перенесённый урок
       становится долгом только после своего нового дня. */
    var debts = [], lagBy = {}, aheadBy = {}, planned = 0, done = 0;
    DATA.order.forEach(function (s) { lagBy[s] = 0; aheadBy[s] = 0; });
    DATA.days.forEach(function (d) {
      (EFF[d] || []).forEach(function (id) {
        var L = lessonOf(id);
        if (!L || !(L.s in lagBy)) return;
        var ok = isDone(id);
        if (d < today && !ok) { debts.push({ id: id, date: d }); lagBy[L.s]++; }
        if (d > today && ok) aheadBy[L.s]++;
        if (d <= today) { planned++; if (ok) done++; }
      });
    });

    var lags = document.getElementById("lags");
    lags.innerHTML = "";
    DATA.order.forEach(function (s) {
      var lag = lagBy[s], ahead = aheadBy[s];
      var el = document.createElement("span");
      el.className = "lag " + (lag > 0 ? "behind" : ahead > 0 ? "ahead" : "ok");
      var n = document.createElement("span"); n.textContent = DATA.subj[s].s;
      var b = document.createElement("b");
      b.textContent = lag > 0 ? "−" + lag : ahead > 0 ? "+" + ahead : "0";
      el.appendChild(n); el.appendChild(b);
      lags.appendChild(el);
    });

    var LIMIT = 15;
    var debtList = document.getElementById("debtList");
    debtList.innerHTML = "";
    var shown = showAllDebts ? debts : debts.slice(0, LIMIT);
    shown.forEach(function (d) {
      var c = card(d.id, { debt: true, debtDate: d.date });
      if (c) debtList.appendChild(c);
    });
    document.getElementById("debtGroup").hidden = debts.length === 0;
    document.getElementById("debtCount").textContent =
      debts.length + " " + plural(debts.length, "урок", "урока", "уроков") +
      " " + (debts.length === 1 ? "не закрыт" : "не закрыто");
    var moreBtn = document.getElementById("debtMore");
    if (debts.length > LIMIT) {
      moreBtn.hidden = false;
      moreBtn.textContent = showAllDebts
        ? "Свернуть"
        : "Показать ещё " + (debts.length - LIMIT) + " " + plural(debts.length - LIMIT, "урок", "урока", "уроков");
    } else { moreBtn.hidden = true; }

    /* уроки дня — в порядке, который задал родитель; время сверх сетки считается само */
    var list = document.getElementById("todayList");
    list.innerHTML = "";
    var ids = EFF[today] || [], doneToday = 0, shownToday = 0;
    ids.forEach(function (id, i) {
      var c = card(id, { time: timeOf(i) });
      if (!c) return;
      shownToday++;
      if (isDone(id)) doneToday++;
      list.appendChild(c);
    });
    if (!shownToday) list.innerHTML = '<div class="empty">На этот день уроков нет</div>';
    document.getElementById("todayMeta").textContent = "пройдено " + doneToday + " из " + shownToday;

    /* прогресс: пройдено от запланированного по сегодняшний день включительно */
    document.getElementById("progBar").style.width = planned ? Math.round(done / planned * 100) + "%" : "0";
    document.getElementById("dayMeta").textContent =
      "за год пройдено " + done + " из " + planned + " запланированных на сегодня";
  }

  /* ── Навигация ── */
  var daySel = document.getElementById("day");
  DATA.days.forEach(function (d) {
    var o = document.createElement("option");
    o.value = d; o.textContent = shortHuman(d);
    daySel.appendChild(o);
  });
  function setDay(d) {
    today = d; daySel.value = d;
    var i = DATA.days.indexOf(d);
    document.getElementById("prev").disabled = i <= 0;
    document.getElementById("next").disabled = i >= DATA.days.length - 1;
    document.getElementById("todayBtn").disabled = (i === todayIdx());
    showAllDebts = false;
    render();
  }
  daySel.addEventListener("change", function () { setDay(daySel.value); });
  document.getElementById("prev").addEventListener("click", function () {
    var i = DATA.days.indexOf(today); if (i > 0) setDay(DATA.days[i - 1]);
  });
  document.getElementById("next").addEventListener("click", function () {
    var i = DATA.days.indexOf(today); if (i < DATA.days.length - 1) setDay(DATA.days[i + 1]);
  });
  document.getElementById("debtMore").addEventListener("click", function () {
    showAllDebts = !showAllDebts; render();
  });

  /* Открываемся всегда на сегодняшнем дне — выбор дня не запоминается */
  document.getElementById("todayBtn").addEventListener("click", function () {
    setDay(DATA.days[todayIdx()]);
  });

  /* Планшет мог пролежать открытым до следующего дня — перескакиваем сами */
  var lastReal = realToday();
  document.addEventListener("visibilitychange", function () {
    if (document.hidden) return;
    var now = realToday();
    if (now !== lastReal) { lastReal = now; setDay(DATA.days[todayIdx()]); }
    if (sb) { pull(false); pullEdits(); }
  });

  today = DATA.days[todayIdx()];

  sid = lsGet("sid", "s1");
  if (sid !== "s1" && sid !== "s2") sid = "s1";

  setDay(today);
  setSync("", "загружаю…");

  if (sb) {
    watch();
  } else if (window.claude && typeof window.claude.use === "function") {
    window.claude.use("db").then(function (d) {
      db = d || null;
      if (!db) setSync("off", "отметки хранятся на этом устройстве");
      watch();
    }).catch(function () { setSync("off", "отметки хранятся на этом устройстве"); watch(); });
  } else {
    setSync("off", "отметки хранятся на этом устройстве");
    watch();
  }

  document.getElementById("footNote").textContent =
    "Год целиком: " + DATA.days.length + " учебных дней, 25 уроков в неделю.";
})();
</script>
